title: '2FA Options'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          - handle: addon_instructions
            field:
              type: section
              display: 'Alt Google 2FA'
              icon: section
              instructions: "Settings for the Google 2FA integration. You may not have user roles if you're rocking the Free version of Statamic, in which case, 2FA for super users should be enough!"
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
          -
            handle: alt_google_2fa_forced_super_user
            field:
              type: radio
              display: '2FA for Super Users'
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              input_type: text
              antlers: false
              hide_display: false
              width: 100
              inline: true
              default: off
              options:
                - key: enforce
                  value: Enforced
                - key: optional
                  value: Optional
                - key: off
                  value: Off
          -
            handle: alt_google_2fa_unverified_user_no_redirect
            field:
              type: toggle
              display: 'Disable redirect for users who have not verified their email address'
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              antlers: false
              hide_display: false
          -
            handle: alt_google_2fa_forced_roles
            field:
              type: user_roles
              display: 'Enforce for these user roles'
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              input_type: text
              antlers: false
              hide_display: false
              width: 50
          -
            handle: alt_google_2fa_optional_roles
            field:
              type: user_roles
              display: 'Optional for these user roles'
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              input_type: text
              antlers: false
              hide_display: false
              width: 50
